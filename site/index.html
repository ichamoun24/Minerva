<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerva · jobs that fit you</title>
<meta name="description" content="Minerva matches your resume and priorities to open jobs from company career pages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: listings app. Top bar (brand, location, profile, saved) → filter bar → split view: map with pay-tag pins | scrolling grid of listing cards. Listing detail opens as a sheet. First visit runs a 5-step prescreen. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#15201c; --muted:#5f6b66; --line:#dfe4e1;
  --accent:#0d6b57; --accent-2:#e2f1ec; --tag:#0d6b57; --tag-ink:#ffffff; --hot:#d9483b;
  --water:#d7e6ea; --land:#ffffff; --land2:#eef1ef; --hood:#e2e7e4;
  --c-early:#c8501a; --c-late:#6d46d8; --c-large:#1f6fc0; --c-small:#2e8a42; --c-invest:#c0265a; --c-mission:#0b7f8f;
  --display:"Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --surface:#161e1b; --ink:#e7eeeb; --muted:#9aa8a2; --line:#27322e;
    --accent:#4fc3a1; --accent-2:#173029; --tag:#4fc3a1; --tag-ink:#0b1210; --hot:#f07a6e;
    --water:#0b1519; --land:#1b2420; --land2:#141b18; --hood:#2a3530;
    --c-early:#f08a54; --c-late:#a68bf5; --c-large:#6aaaf0; --c-small:#62c27a; --c-invest:#f0729b; --c-mission:#4cc3d1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --ink:#e7eeeb; --muted:#9aa8a2; --line:#27322e;
  --accent:#4fc3a1; --accent-2:#173029; --tag:#4fc3a1; --tag-ink:#0b1210; --hot:#f07a6e;
  --water:#0b1519; --land:#1b2420; --land2:#141b18; --hood:#2a3530;
  --c-early:#f08a54; --c-late:#a68bf5; --c-large:#6aaaf0; --c-small:#62c27a; --c-invest:#f0729b; --c-mission:#4cc3d1;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 21px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:4px;border-radius:2px;background:var(--surface)}
.loc{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.loc button{border:0;background:none;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.loc button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search{flex:1;min-width:200px;max-width:420px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--bg)}
.spacer{flex:1}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tbtn:disabled{opacity:.5;cursor:not-allowed}
.tbtn .n{background:var(--hot);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
select.prof{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);font-weight:600;max-width:220px}

/* filter bar */
.fbar{display:flex;gap:8px;align-items:center;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:6}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fbtn[aria-expanded="true"],.fbtn.on{border-color:var(--ink)}
.fbtn.on{background:var(--ink);color:var(--surface)}
.pop{position:absolute;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px;min-width:260px;z-index:20;display:flex;flex-direction:column;gap:10px}
.pop h4{margin:0;font:700 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent);color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
.rangeval{font:700 15px var(--display);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.fbar .count{margin-left:auto;font-size:13px;color:var(--muted)}
.fbar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-weight:600;font-size:13px}

/* split */
.split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
@media (min-width:1500px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.mapside{position:relative;background:var(--water);min-height:0}
.listside{overflow:auto;padding:16px 18px 40px;min-height:0}
@media (max-width:900px){
  body{height:auto;display:block}
  .split{display:block}
  .mapside{height:60vh}
  .split.show-list .mapside{display:none}
  .split.show-map .listside{display:none}
}
.mobtoggle{display:none}
@media (max-width:900px){.mobtoggle{display:inline-flex;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}}

svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.map.drag{cursor:grabbing}
.land-other{fill:var(--land2);stroke:var(--line);stroke-width:.6}
.hood{fill:var(--land);stroke:var(--hood);stroke-width:.7}
.hoodlbl{font:600 9px var(--body);fill:var(--muted);text-anchor:middle;letter-spacing:.05em;text-transform:uppercase;pointer-events:none;opacity:.8}
.river{font:italic 600 12px var(--body);fill:var(--muted);opacity:.7;text-anchor:middle;pointer-events:none}
.tagpin{cursor:pointer}
.tagpin rect{fill:var(--tag);stroke:var(--surface);stroke-width:1.5}
.tagpin path.ptr{fill:var(--tag)}
.tagpin text{fill:var(--tag-ink);font:700 10.5px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tagpin.nopay rect,.tagpin.nopay path.ptr{fill:var(--surface)} .tagpin.nopay rect{stroke:var(--tag)} .tagpin.nopay text{fill:var(--ink)}
.tagpin.approx rect{stroke-dasharray:3 2}
.tagpin.on rect,.tagpin.on path.ptr{fill:var(--ink)} .tagpin.on text{fill:var(--surface)} .tagpin.on.nopay rect{stroke:var(--ink)}
.tagpin.saved rect{stroke:var(--hot);stroke-width:2.5}
.tagpin.closed{opacity:.35}
.tagpin.dim{display:none}
.tagpin circle.newdot{fill:var(--hot);stroke:var(--surface);stroke-width:1.5}
.homepin rect{fill:var(--ink)} .homepin text{fill:var(--surface);font:700 8px var(--body);text-anchor:middle;dominant-baseline:central}
.homering{fill:none;stroke:var(--muted);stroke-dasharray:3 4;opacity:.5}
.homelbl{font:600 9px var(--body);fill:var(--muted)}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.maplegend{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 9px;border-radius:8px;z-index:2;max-width:calc(100% - 80px)}
.hovercard{position:absolute;z-index:8;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.22);overflow:hidden;pointer-events:none;display:none}
.hovercard.show{display:block}
.hovercard .art{height:64px}
.hovercard .b{padding:9px 11px}

/* listing cards */
.lhead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lhead h2{font-size:22px}
.lhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s}
.lcard:hover,.lcard.on{box-shadow:0 8px 24px rgba(0,0,0,.12);border-color:var(--ink)}
.lcard.closed{opacity:.55}
.art{position:relative;height:118px;background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 55%,#000) 100%);color:#fff;display:flex;align-items:flex-end;padding:10px 12px;overflow:hidden}
.art::before{content:attr(data-mono);position:absolute;right:-6px;top:-18px;font:700 92px/1 var(--display);opacity:.16;letter-spacing:-.04em}
.art .co{font:700 15px var(--display);text-shadow:0 1px 2px rgba(0,0,0,.25);position:relative}
.badge{position:absolute;top:9px;left:10px;background:rgba(255,255,255,.95);color:#15201c;border-radius:6px;padding:2px 7px;font-weight:700;font-size:12px;display:flex;gap:5px;align-items:center}
.badge.new{left:auto;right:46px;background:var(--hot);color:#fff}
.heart{position:absolute;top:7px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.95);cursor:pointer;display:grid;place-items:center;color:#15201c;font-size:16px;line-height:1;pointer-events:auto}
.heart[aria-pressed="true"]{color:var(--hot)}
.lbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.price{font:700 19px var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.price.muted{color:var(--muted);font-size:15px;font-weight:600}
.facts{font-size:13px;color:var(--ink);display:flex;flex-wrap:wrap;gap:0 10px}
.facts span+span::before{content:"";display:inline-block;width:1px;height:10px;background:var(--line);margin-right:10px;vertical-align:middle}
.ltitle{font-weight:600;font-size:13.5px;margin-top:2px}
.lsub{font-size:12.5px;color:var(--muted)}
.ltags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tg{font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tg.top{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tg.sugg{border-style:dashed;color:#a8650a;border-color:#a8650a}
.tg.closed{color:var(--hot);border-color:var(--hot)}
.skel{height:250px;border-radius:14px;background:linear-gradient(90deg,var(--surface),var(--bg),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.notice{border-left:3px solid #a8650a;background:var(--surface);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.notice b{color:var(--ink)} .notice.ok{border-left-color:var(--accent)} .notice.err{border-left-color:var(--hot)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.step{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);display:inline-flex;gap:5px;align-items:center}
.step.run{border-color:#a8650a}.step.done{border-color:var(--accent)}.step.err{border-color:var(--hot);color:var(--hot)}
.spin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:var(--surface)}
.foot{font-size:12px;color:var(--muted);margin-top:18px;max-width:80ch}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow:auto}
.sheet{background:var(--surface);border-radius:16px;width:min(880px,100%);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet .art{height:190px;padding:18px 22px}
.sheet .art::before{font-size:180px;top:-36px}
.sheet .art .co{font-size:22px}
.sheet .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#15201c;font-size:18px;cursor:pointer}
.sheet .heart{top:12px;right:56px;width:36px;height:36px}
.sbody{padding:18px 22px 24px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.sbody{grid-template-columns:1fr}}
.sbody h2{font-size:24px}
.sbody .price{font-size:26px}
.ftable{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
.ftable div{background:var(--surface);padding:8px 10px}
.ftable small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ftable b{font-weight:600;font-size:13.5px}
.sect{margin-top:14px}
.sect h3{font:700 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.sect p{margin:4px 0}
.hookline{background:var(--bg);border-left:3px solid var(--accent);padding:7px 10px;border-radius:6px;font-size:13.5px}
.mbar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.mbar .tr{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.mbar .tr i{display:block;height:100%;background:var(--accent)}
.mbar .w{color:var(--muted);font-size:11px}
.apply{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.apply .big{font:700 34px/1 var(--display);color:var(--accent)}
.apply a.btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--surface);border-radius:10px;padding:11px;font-weight:700}
.est{font-size:11px;color:var(--muted)}
.similar{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.similar .lcard .art{height:70px}
.similar .lcard .price{font-size:15px}

/* applications + interviews */
.track{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px}
.track h4{margin:0;font:700 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.round{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);display:flex;flex-direction:column;gap:5px}
.round b{font-size:13.5px}
.round .when{font-size:12.5px;color:var(--muted)}
.round .acts{display:flex;flex-wrap:wrap;gap:5px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.mini.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mini.danger{color:var(--hot)}
.ov2{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:45;display:flex;justify-content:center;align-items:flex-start;padding:24px 14px;overflow:auto}
.panel2{background:var(--surface);border-radius:16px;width:min(820px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.panel2 .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel2 .ph h2{font-size:21px}
.panel2 .ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel2 .pb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel2 .pf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;flex:none}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.frm{grid-template-columns:1fr}}
.frm .full{grid-column:1/-1}
.frm input,.frm select,.frm textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.qa{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.qa .qt{font-weight:600}
.qa .ty{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.qa .wh{font-size:12.5px;color:var(--muted)}
.qa .ol{font-size:13px;background:var(--bg);border-radius:6px;padding:6px 8px}
.blist{margin:0;padding-left:18px}.blist li{margin:3px 0}
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg.ai{background:var(--bg);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--surface);align-self:flex-end}
.compose{display:flex;gap:8px;width:100%}
.compose textarea{flex:1;min-height:70px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow:auto}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h3{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.acard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:8px 9px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.acard b{font-size:13px}.acard span{font-size:12px;color:var(--muted)}
.acard .nx{color:var(--accent);font-weight:600}

/* onboarding */
.ob{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;display:flex;justify-content:center;padding:28px 16px}
.obin{width:min(760px,100%);display:flex;flex-direction:column;gap:18px}
.obtop{display:flex;justify-content:space-between;align-items:center}
.prog{display:flex;gap:6px}.prog i{width:34px;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--accent)}
.obin h1{font-size:34px;line-height:1.08}
.obin .lead{color:var(--muted);font-size:15px;margin:6px 0 0;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-2)}
.drop strong{color:var(--ink)}
.lbl{font-weight:600;font-size:13px;display:block;margin-bottom:6px}
textarea,input[type=text],select.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{min-height:110px;resize:vertical;font-size:13px}
.fstat{font-size:13px;color:var(--muted)} .fstat.ok{color:var(--accent)} .fstat.err{color:var(--hot)}
.prio{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start}
.pcard b{display:block;font-size:14px}
.pcard span{font-size:12.5px;color:var(--muted)}
.pcard .rk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-2)}
.pcard[aria-pressed="true"] .rk{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ck{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;background:var(--surface)}
.ck input{margin-top:3px;accent-color:var(--accent)}
.ck span{font-size:12.5px;color:var(--muted);display:block}
.obnav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.note{font-size:12.5px;color:var(--muted);margin:0}

.split.nomap{grid-template-columns:minmax(0,1fr)}
.split.nomap .mapside{display:none}
@media (max-width:900px){.split.nomap .listside{display:block}}
.bub{cursor:pointer;outline:none}
.bub circle{fill:var(--accent);stroke:var(--surface);stroke-width:2;opacity:.9}
.bub.wide circle{opacity:.75;stroke-dasharray:4 3}
.bub .bn{fill:var(--tag-ink);font:700 11px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bub .bl{fill:var(--ink);font:600 10px var(--body);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.bub.sel circle,.bub.on circle,.bub:hover circle,.bub:focus circle{fill:var(--hot);opacity:1}
.areachips{position:absolute;left:10px;top:10px;right:58px;display:flex;flex-wrap:wrap;gap:6px;z-index:3;pointer-events:none}
.achip{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:600 12px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.achip[aria-pressed="true"]{background:var(--accent);color:var(--tag-ink);border-color:var(--accent)}
.more{display:flex;justify-content:center;margin:16px 0 4px}
.desc{white-space:pre-wrap;font-size:13.5px;line-height:1.55;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);margin-bottom:8px}
.mbar .src{display:block;font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.25}
.hovercard .hrow{font-size:12.5px;margin-top:5px;line-height:1.3}
.hovercard .hrow b{color:var(--accent)}
.foot a{color:var(--accent)}

function attrs(j,p){
  const fit=Math.max(1,Math.min(5,.5*j._lf+.38*j._rf+.12*(1+4*j._kf)));
  const pt=j._pay; const pay=pt?(pt>=200?5:pt>=150?4.5:pt>=120?4:pt>=90?3:pt>=60?2:1.5):2.5;
  let bal=BAL[j.role]||3; if(j.level>=4) bal-=.5; if(j.cat==="small") bal-=.5; if(!j.fulltime) bal+=.5; bal=Math.max(1,Math.min(5,bal));
  const d=j._dist; const commute=d==null?3:d<1?5:d<2?4:d<3?3:d<5?2:1;

async function readFile(f){
  const name=f.name.toLowerCase(); let text="";
  if(name.endsWith(".pdf")){
    if(!window.pdfjsLib) throw new Error("PDF reader didn't load");
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    for(let i=1;i<=pdf.numPages;i++){ const c=await (await pdf.getPage(i)).getTextContent(); let last=null;
      for(const it of c.items){ const y=it.transform?it.transform[5]:null; if(last!==null&&y!==null&&Math.abs(y-last)>2) text+="\n"; text+=it.str+(it.hasEOL?"\n":" "); last=y; } text+="\n\n"; }
  } else if(name.endsWith(".docx")){ if(!window.mammoth) throw new Error("Word reader didn't load"); text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value; }
  else text=await f.text();
  text=text.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  if(text.length<200) throw new Error("very little text found (it may be a scanned image)");
  return text;
}

const FEED={}; let STATS=null, COUNTS={}, FEEDV=0, MEMO=null;
async function getJSON(u,force){ const r=await fetch(u,{cache:force?"reload":"no-cache"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function loadMeta(force){
  try{ STATS=await getJSON(FEED_BASE+"stats.json",force); }catch(e){ STATS=null; }
  try{ const cs=await getJSON(FEED_BASE+"companies.json",force); COUNTS={}; cs.forEach(c=>COUNTS[c.c]=(COUNTS[c.c]||0)+c.n); }catch(e){ COUNTS={}; }

function loadFeed(city,force){
  const cur=FEED[city];
  if(cur&&cur.state==="loading") return cur.p;
  if(cur&&cur.state==="ready"&&!force) return Promise.resolve(cur);
  const prevAt=cur&&cur.at;
  FEED[city]={state:"loading",jobs:cur&&cur.jobs};
  const p=(async()=>{
    try{
      if(!STATS||force) await loadMeta(force);
      const raw=await getJSON(FEED_BASE+city+".json",force);
      const ref=STATS&&STATS.updatedAt?new Date(STATS.updatedAt):new Date();
      FEED[city]={state:"ready",jobs:raw.map(x=>fromFeed(x,city,ref)),at:STATS&&STATS.updatedAt,refreshed:!!force,changed:force&&prevAt&&STATS&&prevAt!==STATS.updatedAt};
    }catch(e){ FEED[city]={state:"error",err:e.message}; }
    FEEDV++; MEMO=null; renderAll(); return FEED[city];
  })();
  FEED[city].p=p; return p;
}
function parsePay(s){
  const main=String(s||"").split("•")[0].trim(); if(!main) return {text:"",top:0,lo:0};
  const usd=/\$/.test(main)&&!/(CA|AU|A|NZ|S|HK|MX|C)\$/.test(main);
  const hourlyWord=/(per hour|\/\s?h(ou)?r|hourly)/i.test(main), monthly=/(per month|\/\s?mo(nth)?\b)/i.test(main), daily=/(per day|\/\s?day|daily)/i.test(main);
  const nums=[...main.matchAll(/(\d[\d,]*(?:\.\d+)?)([kKmM])?(?![a-zA-Z])/g)].map(m=>{ let v=parseFloat(m[1].replace(/,/g,"")); if(/k/i.test(m[2]||"")) v*=1e3; else if(/m/i.test(m[2]||"")) v*=1e6; return v; }).filter(v=>v>0);
  if(!usd||!nums.length) return {text:main,top:0,lo:0};
  const hi=Math.max(...nums), lo=Math.min(...nums), hourly=!daily&&(hourlyWord||(hi<300&&!monthly)), mult=daily?260:hourly?2080:monthly?12:1;
  const text=hourly&&!hourlyWord?main+" /hr":main, top=hi*mult/1000;
  if(top<10||top>5000) return {text,top:0,lo:0,hourly};
  return {text,top,lo:lo*mult/1000,hourly};
}

// Rules ending in "?" only count at nonprofits, schools and government: "Community Manager" at a
// software company is marketing, while the same title at a food bank is community work.
function roleOf(title,dept,org){
  const mission=org&&org!=="company";
  const pick=t=>{ for(const [k,re] of ROLE_RULES){ if(k.endsWith("?")&&!mission) continue; if(re.test(t)) return k.replace("?",""); } return ""; };
  return pick(title)||(dept&&pick(dept))||"other";
}
const ORG_NAME_EDU=/\b(school|schools|academy|charter|universit(y|ies)|college|institute of technology|head start|montessori|yeshiva|preparatory|prep\b)/i;
const ORG_NAME_NONPROFIT=/\b(foundation|museum|library|hospital|health system|medical center|society|association|council|alliance|coalition|conservancy|ymca|ywca|church|ministr(y|ies)|friends of|nonprofit|non-profit|charit(y|ies)|league|theat(er|re)|orchestra|ballet|opera|philharmonic|zoo|botanical|aquarium|habitat for humanity|united way|boys & girls|big brothers|food bank|legal aid|tutorial program|settlement house|center for|centre for|fund for|trust for|conservation|historical|arts council|public radio|public media)\b/i;
const ORG_COMPANY=/\b(llc|l\.l\.c|inc|incorporated|corp|corporation|co\.|company|partners|group|holdings|capital|ventures|technologies|labs|associates|consulting|ltd|plc|gmbh)\b/i;
// What kind of employer: the website's ending decides when we have it (.org, .edu, .gov vs .com),
// otherwise words in the name. Government sources are always public sector.
function orgOf(company,src,web){
  if(src==="nycgov"||src==="usajobs") return "public";
  const w=String(web||"").toLowerCase().replace(/\/.*$/,"");
  if(/\.(gov|mil)$|\.gov\.[a-z]{2}$|\.nyc$/.test(w)) return "public";
  if(/\.edu$|\.k12\.[a-z]{2}\.us$/.test(w)) return "education";
  if(/\.org$/.test(w)) return ORG_NAME_EDU.test(company)?"education":ORG_COMPANY.test(company)&&!ORG_NAME_NONPROFIT.test(company)?"company":"nonprofit";
  if(w) return "company";
  if(ORG_COMPANY.test(company)) return "company";
  if(ORG_NAME_EDU.test(company)) return "education";
  if(ORG_NAME_NONPROFIT.test(company)) return "nonprofit";
  return "company";
}
function levelOf(title){
  const t=title.toLowerCase();
  if(/\b(intern|internship|co-?op|apprentice(ship)?|summer (analyst|associate))\b/.test(t)) return 0;
  if(/\b(assistant vice president|avp)\b/.test(t)) return 2;
  if(/\b(chief|ceo|cfo|cto|coo|cmo|svp|evp|vice president|vp|president|head of|general manager)\b/.test(t)) return 5;
  if(/\b(director|senior manager|sr\.? manager|group manager)\b/.test(t)) return 4;
  const icMgr=/(account|product|program|project|success|partner|partnerships|community|office|social|media|marketing|brand|content|events?|sales|territory|relationship|client) manager/.test(t);
  if(/\b(principal|staff|senior|sr\.?|lead|iii|iv)\b/.test(t)){ if(/\bmanager\b/.test(t)&&!icMgr) return 4; return 3; }
  if(/\bmanager\b/.test(t)) return icMgr?2:3;
  if(/\b(junior|jr\.?|entry|new grad|graduate|associate|coordinator|assistant|representative|sdr|bdr|fellow|trainee|analyst|ambassador)\b|\b(i|1)$|\blevel (i|1)\b/.test(t)) return 1;
  return 2;

function reasons(j,p){

  else if((p.inferred||[]).includes(j.role)) why.push(`${ROLES[j.role]} lines up with your resume.`);
  if(ex){ if(j._lf>=5) why.push(`The title reads ${LEVELS[j.level].toLowerCase()}, which fits ${ex[0]} of experience.`); else if(j._lf<3) watch.push(`The title reads ${LEVELS[j.level].toLowerCase()}, a stretch from ${ex[0]} of experience.`); }

  if(j.pay){ if(p.minPay&&j._pay&&j._pay<p.minPay) watch.push(`The top of the listed range is below your $${p.minPay}K minimum.`); else why.push(`Pay is listed: ${j.pay}.`); } else watch.push("Pay isn't listed.");
  if(j.setup) why.push(`Listed as ${j.setup.toLowerCase()}.`);
  if(j.equity) why.push("The posting mentions equity.");
  if((p.priorities||[]).includes("mission")&&j._mission>=4) why.push(j.org!=="company"?`${ORGS[j.org]} employer.`:`${ROLES[j.role]} work.`);
  if(!j.fulltime) watch.push("Looks part-time, contract, temporary or an internship.");

}

/* ---------- applications, interviews, prep, practice ---------- */
const STATUSES=[["saved","Saved"],["applied","Applied"],["interviewing","Interviewing"],["offer","Offer"],["closed","Closed"]];
const FORMATS={video:"Video call",phone:"Phone",onsite:"On-site",other:"Other"};
function snapshotOf(j,city){ const rs=reasons(j,P()); return {id:j.id,company:j.company,title:j.title,url:linkOf(j),city,stage:`${CATS[j.cat]}, ${j.openRoles} open roles`,cat:j.cat,mono:j.mono,why:rs.why.join(" "),hook:"",watch:rs.watch.join(" "),hood:j.area||"",loc:j.loc,level:LEVELS[j.level],pay:j.pay||""}; }
function ensureApp(p,j,city){ p.apps=p.apps||{}; const k=jkey(j); if(!p.apps[k]) p.apps[k]={status:"saved",job:snapshotOf(j,city),rounds:[],created:today()}; return p.apps[k]; }
const whenOf=r=>r.date?new Date(`${r.date}T${r.time||"09:00"}`):null;
const fmtWhen=r=>{ const d=whenOf(r); return d&&!isNaN(d)?d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"Time not set"; };
function calLinks(app,r){
  const d=whenOf(r); if(!d||isNaN(d)) return null;
  const end=new Date(d.getTime()+(+r.dur||45)*60000);
  const g=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const title=`${r.name||"Interview"}: ${app.job.company}`;
  const body=`${app.job.title} at ${app.job.company}${r.with?"\nWith: "+r.with:""}${r.notes?"\n\n"+r.notes:""}\n\nPosting: ${app.job.url}`;
  const loc=r.format==="onsite"?(r.where||app.job.company):(FORMATS[r.format]||"");
  return {
    google:`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(title)}&dates=${g(d)}/${g(end)}&details=${enc(body)}&location=${enc(loc)}`,
    outlook:`https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=${enc(title)}&startdt=${enc(d.toISOString())}&enddt=${enc(end.toISOString())}&body=${enc(body)}&location=${enc(loc)}`
  };
}
function roundsHTML(app,k){
  const rs=(app.rounds||[]).slice().sort((a,b)=>(whenOf(a)||0)-(whenOf(b)||0));
  return rs.map(r=>{ const cl=calLinks(app,r); return `<div class="round">
    <b>${esc(r.name||"Interview")}</b>
    <span class="when">${esc(fmtWhen(r))}${r.dur?` · ${esc(r.dur)} min`:""}${r.format?` · ${esc(FORMATS[r.format]||r.format)}`:""}${r.with?` · with ${esc(r.with)}`:""}</span>
    <div class="acts">
      <button class="mini primary" data-prep="${r.id}" data-k="${esc(k)}">${r.brief?"Open prep":"Prep me"}</button>
      <button class="mini" data-practice="${r.id}" data-k="${esc(k)}">Practice</button>
      ${cl?`<a class="mini" href="${cl.google}" target="_blank" rel="noopener">+ Google Calendar</a><a class="mini" href="${cl.outlook}" target="_blank" rel="noopener">+ Outlook</a>`:""}
      <button class="mini" data-editr="${r.id}" data-k="${esc(k)}">Edit</button>
    </div></div>`; }).join("");
}
function trackHTML(p,j){
  const app=(p.apps||{})[jkey(j)];
  return `<div class="track" id="track">
    <h4>Your application</h4>
    <div class="seg" role="group" aria-label="Application status">${STATUSES.map(([k,l])=>`<button data-st="${k}" aria-pressed="${app&&app.status===k}">${l}</button>`).join("")}</div>
    ${app?roundsHTML(app,jkey(j)):`<p class="note">Pick a status to start tracking this job.</p>`}
    <button class="mini" id="addround" style="align-self:flex-start">+ Add an interview</button>
  </div>`;
}
function wireTrack(p,j,city){
  $$("#track [data-st]").forEach(b=>b.onclick=()=>{ const app=ensureApp(p,j,city); app.status=b.dataset.st; if(b.dataset.st==="applied"&&!app.appliedAt) app.appliedAt=today(); if(!(p.saved||[]).includes(jkey(j))) p.saved=[...(p.saved||[]),jkey(j)]; persist(); renderAll(); });
  $("#addround").onclick=()=>{ const app=ensureApp(p,j,city); if(app.status==="saved"||app.status==="applied") app.status="interviewing"; persist(); openRoundForm(p,jkey(j),null); };
  wireRoundButtons(p);
}
function wireRoundButtons(p,scope){
  const s=scope||document;
  s.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>openPrep(p,b.dataset.k,b.dataset.prep));
  s.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>openPractice(p,b.dataset.k,b.dataset.practice));
  s.querySelectorAll("[data-editr]").forEach(b=>b.onclick=()=>openRoundForm(p,b.dataset.k,b.dataset.editr));
}
function ov2(html){ $("#ov2").innerHTML=`<div class="ov2" id="ov2s" role="dialog" aria-modal="true">${html}</div>`; $("#ov2s").onclick=e=>{ if(e.target.id==="ov2s") closeOv2(); }; const x=$("#ov2 .xbtn"); if(x){ x.onclick=closeOv2; x.focus(); } }
function closeOv2(){ $("#ov2").innerHTML=""; if(UI.boardOpen) openBoard(); else { const p=P(); if(UI.detail) renderDetail(p,p.city||"nyc"); renderTop(p,p.city||"nyc"); } }

/* add / edit an interview round, with "paste the recruiter's email" */
function openRoundForm(p,k,rid){

  ov2(`<div class="panel2">
    <div class="ph"><div><h2>${rid?"Edit interview":"Add an interview"}</h2><p>${esc(app.job.title)} · ${esc(app.job.company)}</p></div><button class="xbtn" aria-label="Close">×</button></div>

        <div><label class="lbl" for="rt">Start time (your time zone)</label><input id="rt" type="time" value="${esc(r.time)}"></div>
        <div><label class="lbl" for="rdur">Length (minutes)</label><input id="rdur" type="number" min="10" step="5" value="${esc(r.dur)}"></div>
        <div><label class="lbl" for="rf">Format</label><select id="rf">${Object.entries(FORMATS).map(([k2,l])=>`<option value="${k2}" ${r.format===k2?"selected":""}>${l}</option>`).join("")}</select></div>

        <div class="full"><label class="lbl" for="rno">Notes</label><textarea id="rno" style="min-height:70px">${esc(r.notes)}</textarea></div>
      </div>

  </div>`);
  $("#rcancel").onclick=closeOv2;
  $("#rsave").onclick=()=>{ Object.assign(r,{name:$("#rn").value.trim()||"Interview",date:$("#rd").value,time:$("#rt").value,dur:$("#rdur").value,format:$("#rf").value,with:$("#rw").value.trim(),where:$("#rwh").value.trim(),notes:$("#rno").value.trim()});
    if(!rid) app.rounds.push(r); if(app.status!=="offer"&&app.status!=="closed") app.status="interviewing"; persist(); closeOv2(); };
  const del=$("#rdel"); if(del) del.onclick=()=>{ if(!del.dataset.arm){ del.dataset.arm=1; del.textContent="Click again to delete"; return; } app.rounds=app.rounds.filter(x=>x.id!==rid); persist(); closeOv2(); };
  $("#readmail").onclick=async()=>{

    if(!AI.ok()){ st.innerHTML='Reading emails uses Claude. <button class="mini" id="needai">Connect Claude</button>'; $("#needai").onclick=openClaude; return; }
    st.innerHTML='<span class="spin"></span> Reading…';
    try{
      const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
      const out=await askJSON(`A job seeker received this email about an interview for "${app.job.title}" at ${app.job.company}. Their time zone is ${tz}. Today is ${new Date().toDateString()}.
Their availability: ${$("#avail").value||"not given"}.
EMAIL:
"""
${txt.slice(0,6000)}
"""
Extract what you can and draft a short, warm, professional reply. If a specific time is confirmed, the reply confirms it. If they are asked to pick times, the reply proposes 2-3 slots that fit the stated availability (or asks the person to fill them in if none given). Sign with "${p.name||"[Your name]"}".

    }catch(e){ st.textContent="Couldn't read it: "+(e&&e.message||"error"); }

/* prep briefing */
function openPrep(p,k,rid){
  const app=p.apps[k], r=app.rounds.find(x=>x.id===rid);
  const b=r.brief;
  const sec=(t,h)=>`<div><h3 style="font:700 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px">${t}</h3>${h}</div>`;
  ov2(`<div class="panel2">
    <div class="ph"><div><h2>Prep: ${esc(r.name||"Interview")}</h2><p>${esc(app.job.title)} · ${esc(app.job.company)} · ${esc(fmtWhen(r))}</p></div><button class="xbtn" aria-label="Close">×</button></div>
    <div class="pb" id="prepbody">
      ${!b?`<div class="empty" id="prepempty">${UI.briefing===rid?'<span class="spin"></span> Writing your briefing… this takes about a minute.':`Claude writes a briefing for this round: the company, what the role is judged on, the likely format, 10–12 probable questions with answer outlines built from your resume, questions to ask, and gaps to get ahead of.<br><br><button class="tbtn primary" id="genb">Write my briefing</button>`}</div>`:`
      <div class="notice">${esc(b.knowledgeNote||"")} ${b.usedDesc?"This briefing uses the job description from the posting plus":"This briefing is based on"} Claude's general knowledge of the company and of typical interviews for this kind of role. It isn't live web research or verified reports from past candidates, so check recent news and the company's site before the call.</div>
      ${sec("The company",`<p style="margin:0">${esc(b.snapshot)}</p>`)}
      ${sec("What this role is judged on",`<ul class="blist">${(b.roleFocus||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`)}
      ${sec("What this round likely looks like",`<p style="margin:0">${esc(b.format)}</p>`)}
      ${sec("Likely questions",(b.questions||[]).map(q=>`<div class="qa"><span class="ty">${esc(q.type)}</span><span class="qt">${esc(q.q)}</span><span class="wh">What they're testing: ${esc(q.why)}</span><span class="ol"><b>Your angle:</b> ${esc(q.outline)}</span></div>`).join(""))}
      ${sec("Get ahead of these",(b.gaps||[]).map(g=>`<div class="qa"><span class="qt">${esc(g.risk)}</span><span class="ol">${esc(g.answer)}</span></div>`).join(""))}
      ${sec("Questions to ask them",`<ul class="blist">${(b.askThem||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`)}
      ${sec("Before the call",`<ul class="blist">${(b.checklist||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`)}
      <p class="note">Written ${esc(b.at||"")}.</p>`}
    </div>
    <div class="pf">${b?`<button class="tbtn" id="regen">Rewrite</button><button class="tbtn" id="copyb">Copy briefing</button>`:""}<button class="tbtn primary" id="topractice">Practice this round</button></div>
  </div>`);
  const g=$("#genb"); if(g) g.onclick=()=>genBrief(p,k,rid);
  const rg=$("#regen"); if(rg) rg.onclick=()=>{ r.brief=null; genBrief(p,k,rid); };
  const cb=$("#copyb"); if(cb) cb.onclick=async e=>{ const t=[`${r.name} — ${app.job.title}, ${app.job.company}`,"",b.snapshot,"","Judged on:",...(b.roleFocus||[]).map(x=>"- "+x),"","Format: "+b.format,"","Likely questions:",...(b.questions||[]).map(q=>`- ${q.q}\n  Angle: ${q.outline}`),"","Ask them:",...(b.askThem||[]).map(x=>"- "+x)].join("\n");
    try{ await navigator.clipboard.writeText(t); e.target.textContent="Copied"; }catch(_){ e.target.textContent="Copy blocked here"; } };
  $("#topractice").onclick=()=>openPractice(p,k,rid);
}
async function genBrief(p,k,rid){
  const app=p.apps[k], r=app.rounds.find(x=>x.id===rid);
  if(!AI.ok()){ const el=$("#prepempty"); if(el){ el.innerHTML='Interview prep uses Claude.<br><br><button class="tbtn primary" id="needai">Connect Claude</button>'; $("#needai").onclick=openClaude; } return; }
  UI.briefing=rid; openPrep(p,k,rid);
  let desc=app.job.desc||""; if(!desc&&app.job.id){ try{ desc=((await fetchDesc({id:app.job.id}))||"").slice(0,9000); if(desc){ app.job.desc=desc; persist(); } }catch(e){} }
  try{
    const out=await askJSON(`You are an interview coach. Write a prep briefing for this candidate's upcoming interview.
CANDIDATE RESUME SUMMARY: ${p.resumeSummary||"not available"}
CANDIDATE PRIORITIES: ${(p.priorities||[]).map(x=>PRI[x][0]).join(", ")||"none given"}
JOB: ${app.job.title} at ${app.job.company} (${app.job.stage||"company details unknown"}), ${CITY[app.job.city]?.name||""}. Pay: ${app.job.pay||"not listed"}. Posting: ${app.job.url}
WHY IT FITS (earlier analysis): ${app.job.why} Resume hook: ${app.job.hook}. Known tradeoff: ${app.job.watch}
JOB LOCATION: ${app.job.loc||"not listed"}. LEVEL (from title): ${app.job.level||"unknown"}.
JOB DESCRIPTION (from the posting): ${desc?desc.slice(0,7000):"not available"}
ROUND: ${r.name||"Interview"}; format ${FORMATS[r.format]||"unknown"}; ${r.dur||"?"} minutes; interviewer(s): ${r.with||"unknown"}; notes: ${r.notes||"none"}.
Use what you know about this company and how this type of role is typically interviewed. Be specific to the company where you can; where you're unsure, say so instead of inventing facts. Answer outlines must use concrete details from the resume summary.
Return ONLY JSON:
{"knowledgeNote":"one sentence on how confident and how current your knowledge of this company is",
 "snapshot":"3-5 sentences: what the company does, how it makes money, stage/size, anything notable",
 "roleFocus":["3-5 things this role is judged on"],
 "format":"2-3 sentences on what this round likely looks like and how to approach it",
 "questions":[{"q":"question","type":"behavioral|role|technical|case|company","why":"what they're testing","outline":"how this candidate should answer, citing their experience"}],
 "gaps":[{"risk":"a likely concern about this candidate","answer":"how to address it"}],
 "askThem":["4-5 sharp questions to ask the interviewer"],
 "checklist":["5 concrete things to do before the call"]}
Give 10-12 questions and 2-3 gaps.`);
    r.brief=Object.assign(out||{},{at:today(),usedDesc:!!desc}); persist();
  }catch(e){ UI.briefing=null; const el=$("#prepempty"); if(el) el.innerHTML="Couldn't write the briefing: "+esc(e&&e.message||"error")+'. <button class="tbtn" id="genb">Try again</button>'; const g=$("#genb"); if(g) g.onclick=()=>genBrief(p,k,rid); return; }
  UI.briefing=null; if($("#prepbody")) openPrep(p,k,rid);
}

/* mock interview */
function openPractice(p,k,rid){
  const app=p.apps[k], r=app.rounds.find(x=>x.id===rid);
  r.practice=r.practice||[];
  const shown=r.practice.slice(1);
  ov2(`<div class="panel2">
    <div class="ph"><div><h2>Practice: ${esc(r.name||"Interview")}</h2><p>${esc(app.job.company)} · Claude plays the interviewer, asks one question at a time and gives quick feedback.</p></div><button class="xbtn" aria-label="Close">×</button></div>
    <div class="pb"><div class="chat" id="chat">${shown.length?shown.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join(""):`<div class="empty">Ready when you are. ${r.brief?"Questions will draw on your prep briefing.":"Tip: write the prep briefing first for sharper questions."}</div>`}</div></div>
    <div class="pf" style="flex-direction:column;align-items:stretch">
      ${shown.length?`<div class="compose"><textarea id="ans" placeholder="Type your answer as you'd say it…" aria-label="Your answer"></textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="tbtn" id="restart">Start over</button><button class="tbtn" id="finish">Finish and score me</button><button class="tbtn primary" id="send">Send answer</button></div>`
      :`<div style="display:flex;justify-content:flex-end"><button class="tbtn primary" id="begin">Start the interview</button></div>`}
    </div></div>`);
  const chat=$("#chat"); chat.parentElement.scrollTop=chat.parentElement.scrollHeight;
  const talk=async userText=>{
    if(!AI.ok()){ openClaude(); return; }
    if(userText!=null) r.practice.push({role:"user",content:userText});
    const bubble=document.createElement("div"); bubble.className="msg ai"; bubble.textContent="…";
    openPractice(p,k,rid); const c2=$("#chat"); c2.appendChild(bubble); c2.parentElement.scrollTop=c2.parentElement.scrollHeight;
    $$("#ov2 .pf button").forEach(b=>b.disabled=true);
    try{
      const txt=await chatAI(r.practice,({text})=>{ bubble.textContent=text||"…"; c2.parentElement.scrollTop=c2.parentElement.scrollHeight; });
      r.practice.push({role:"assistant",content:txt}); persist();
    }catch(e){ r.practice.pop(); bubble.textContent="Couldn't reach Claude: "+(e&&e.message||"error"); return; }
    openPractice(p,k,rid);
  };
  const begin=$("#begin"); if(begin) begin.onclick=()=>{
    r.practice=[{role:"user",content:`Run a realistic mock interview. You are the interviewer for the "${r.name||"interview"}" round for ${app.job.title} at ${app.job.company}${r.with?", played as "+r.with:""}. Format: ${FORMATS[r.format]||"video"}.
Candidate background: ${p.resumeSummary||"not available"}
${r.brief?"Likely questions from the prep briefing (use a mix, and add natural follow-ups): "+(r.brief.questions||[]).map(q=>q.q).join(" | "):""}
Rules: Ask ONE question at a time, the way a real interviewer would. After each answer, give 2-3 sentences of coaching in brackets — one thing that worked, one specific fix — then ask the next question. Ask about 6 questions total. If the candidate writes FINISH, stop and give a short scorecard: overall impression, 3 strengths, 3 fixes, and one answer to rehearse. Start with a one-line greeting and your first question.`}];
    talk(null);
  };
  const send=$("#send"); if(send) send.onclick=()=>{ const a=$("#ans").value.trim(); if(a) talk(a); };
  const ans=$("#ans"); if(ans) ans.onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send.click(); } };
  const fin=$("#finish"); if(fin) fin.onclick=()=>talk("FINISH");
  const rs=$("#restart"); if(rs) rs.onclick=()=>{ if(!rs.dataset.arm){ rs.dataset.arm=1; rs.textContent="Click again to clear"; return; } r.practice=[]; persist(); openPractice(p,k,rid); };
}

/* applications board */
function openBoard(){
  UI.boardOpen=true; const p=P(); const apps=Object.entries(p.apps||{});
  const next=a=>{ const now=Date.now(); const up=(a.rounds||[]).map(r=>({r,d:whenOf(r)})).filter(x=>x.d&&x.d.getTime()>now-36e5).sort((x,y)=>x.d-y.d)[0]; return up?up.r:null; };
  ov2(`<div class="panel2" style="width:min(1200px,100%)">
    <div class="ph"><div><h2>Applications</h2><p>${apps.length?`${apps.length} tracked for ${esc(p.name||"you")}`:"Open any listing and choose a status to start tracking it."}</p></div><button class="xbtn" aria-label="Close">×</button></div>
    <div class="pb"><div class="kanban">${STATUSES.map(([st,l])=>{ const items=apps.filter(([,a])=>a.status===st);
      return `<div class="col"><h3>${l}<span>${items.length}</span></h3>${items.map(([k,a])=>{ const nx=next(a); return `<button class="acard" data-open="${esc(k)}" style="--c:${cvar(a.job.cat||"large")}"><b>${esc(a.job.company)}</b><span>${esc(a.job.title)}</span>${nx?`<span class="nx">${esc(nx.name||"Interview")} · ${esc(fmtWhen(nx))}</span>`:a.appliedAt?`<span>Applied ${esc(a.appliedAt)}</span>`:""}${(a.rounds||[]).length?`<span>${a.rounds.length} interview round${a.rounds.length>1?"s":""}</span>`:""}</button>`; }).join("")}</div>`; }).join("")}</div>
    ${apps.some(([,a])=>(a.rounds||[]).length)?`<div><h3 style="font:700 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0">Interview timeline</h3><div style="display:flex;flex-direction:column;gap:8px" id="tl">${apps.flatMap(([k,a])=>(a.rounds||[]).map(r=>({k,a,r}))).sort((x,y)=>(whenOf(x.r)||0)-(whenOf(y.r)||0)).map(({k,a,r})=>`<div class="round"><b>${esc(a.job.company)} · ${esc(r.name||"Interview")}</b><span class="when">${esc(fmtWhen(r))} · ${esc(a.job.title)}</span><div class="acts"><button class="mini primary" data-prep="${r.id}" data-k="${esc(k)}">${r.brief?"Open prep":"Prep me"}</button><button class="mini" data-practice="${r.id}" data-k="${esc(k)}">Practice</button><button class="mini" data-editr="${r.id}" data-k="${esc(k)}">Edit</button></div></div>`).join("")}</div></div>`:""}
    </div></div>`);
  $("#ov2 .xbtn").onclick=()=>{ UI.boardOpen=false; $("#ov2").innerHTML=""; renderTop(p,p.city||"nyc"); };
  $("#ov2s").onclick=e=>{ if(e.target.id==="ov2s"){ UI.boardOpen=false; $("#ov2").innerHTML=""; } };
  $$("#ov2 [data-open]").forEach(b=>b.onclick=()=>{ const a=p.apps[b.dataset.open]; UI.boardOpen=false; $("#ov2").innerHTML="";
    const city=p.city||"nyc"; const jobs=prepJobs(p,a.job.city||city);
    if(a.job.city&&a.job.city!==city){ p.city=a.job.city; MS.vb=null; renderAll(); }
    if(jobs.find(x=>jkey(x)===b.dataset.open)){ UI.detail=b.dataset.open; renderDetail(p,p.city||"nyc"); } else openAppOnly(p,b.dataset.open); });
  wireRoundButtons(p,$("#ov2"));
}
function openAppOnly(p,k){
  const a=p.apps[k];
  ov2(`<div class="panel2"><div class="ph"><div><h2>${esc(a.job.title)}</h2><p>${esc(a.job.company)} · this job isn't in the current feed for this city (it may have closed)</p></div><button class="xbtn" aria-label="Close">×</button></div>
    <div class="pb"><div class="seg">${STATUSES.map(([s,l])=>`<button data-st2="${s}" aria-pressed="${a.status===s}">${l}</button>`).join("")}</div>${roundsHTML(a,k)}<a class="mini" href="${esc(a.job.url)}" target="_blank" rel="noopener" style="align-self:flex-start">Open the posting ↗</a></div>
    <div class="pf"><button class="mini danger" id="untrack">Stop tracking</button><button class="tbtn primary" id="addr2">+ Add an interview</button></div></div>`);
  $$("[data-st2]").forEach(b=>b.onclick=()=>{ a.status=b.dataset.st2; persist(); openAppOnly(p,k); });
  $("#addr2").onclick=()=>openRoundForm(p,k,null);
  $("#untrack").onclick=e=>{ if(!e.target.dataset.arm){ e.target.dataset.arm=1; e.target.textContent="Click again to stop tracking"; return; } delete p.apps[k]; persist(); closeOv2(); openBoard(); };
  wireRoundButtons(p,$("#ov2"));
}
/* ---------- onboarding prescreen ---------- */
function startOnboard(existing){
  const base=existing?JSON.parse(JSON.stringify(existing)):{id:uid(),name:"",city:P().city||"nyc",exp:"",priorities:[],musts:{},minPay:0,roles:[],cats:[],avoid:"",notes:"",maxDist:0,home:{},saved:[],apps:{},resumeSummary:"",kw:[],inferred:[]};
  if(existing&&existing.demo){ base.id=uid(); base.name=""; base.demo=false; base.resumeSummary=""; base.kw=[]; base.inferred=[]; base.saved=[]; base.apps={}; base.roles=[]; }
  UI.ob={step:existing&&!existing.demo?1:0,d:base,isNew:!existing||!!existing.demo,text:"",guess:null};
  renderOnboard();
}
function renderOnboard(){
  const o=UI.ob; if(!o){ $("#ob").innerHTML=""; return; }
  const d=o.d, city=CITY[d.city]?d.city:"nyc", total=6, G=GEO[city];
  const hoodOpts=G?Object.keys(G.cent).sort():[];
  const curHood=(d.home&&d.home[city]&&d.home[city].hood)||"";
  const g=o.guess;
  const steps=[
   ()=>`<h1>Let's find jobs that actually fit you.</h1><p class="lead">Start with your resume. Minerva reads it right here in your browser to match you against every open job in the feed. It isn't uploaded anywhere.</p>
     <div class="card">
       <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload resume"><strong>Drop your resume</strong> or click to choose<br><span style="font-size:12.5px">PDF, Word (.docx) or .txt</span></div>
       <div class="fstat" id="fstat">${o.text?`Resume loaded · ${o.text.split(/\s+/).length} words`:d.resumeSummary?"Using the resume already on this profile. Drop a new one to replace it.":"Or paste the text below."}</div>
       <div><label class="lbl" for="rtext">Resume text</label><textarea id="rtext">${esc(o.text)}</textarea></div>
       <div><label class="lbl" for="nm">Your name (optional)</label><input type="text" id="nm" value="${esc(d.name)}" placeholder="Read from the resume if blank"></div>
       <p class="note">Minerva keeps a copy of the text in this browser, with email, phone, links and street address removed, so it can match and prep you later. <button class="mini" id="skip">Skip and just browse</button></p>
     </div>`,
   ()=>`<h1>Your level and the work you want</h1><p class="lead">This does most of the matching: job titles are compared with your experience and the kinds of roles you pick.</p>
     <div class="card">
       <div><span class="lbl">Experience</span><div class="chips" id="exp">${Object.entries(EXP).map(([k,[l,s]])=>`<button class="chip" data-k="${k}" aria-pressed="${d.exp===k}" title="${esc(s)}">${l}</button>`).join("")}</div>
         <p class="note">${g&&g.years!=null?`Your resume's dates add up to about ${g.years} year${g.years===1?"":"s"} of work, so we picked ${esc(EXP[g.exp][0])}. Change it if that's off.`:"Pick the closest one."}</p></div>
       <div><span class="lbl">Role types</span><div class="chips" id="roles">${Object.entries(ROLES).filter(([k])=>k!=="other").map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${(d.roles||[]).includes(k)}">${l}</button>`).join("")}</div>
         <p class="note">${o.inferred&&o.inferred.length?`Pre-selected from your resume: ${o.inferred.map(r=>ROLES[r]).join(", ")}. `:""}Only picked role types are shown at first. Leave all off to see everything.</p></div>
     </div>`,
   ()=>`<h1>Where do you want to work?</h1><p class="lead">Like picking a neighborhood. Choose a city${G?", and tell us where home is":""}.</p>
     <div class="card">
       <div><label class="lbl" for="obcity">City</label><select class="inp" id="obcity">${CITY_LIST.map(([k,n])=>`<option value="${k}" ${k===city?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
       ${G?`<div><label class="lbl" for="hood">Home neighborhood (optional)</label><select class="inp" id="hood"><option value="">Not set</option>${hoodOpts.map(h=>`<option ${h===curHood?"selected":""}>${esc(h)}</option>`).join("")}</select></div>
       <div><span class="lbl">How far from home</span><div class="chips" id="dist">${[[0,"Anywhere"],[1,"Within 1 mi"],[2,"Within 2 mi"],[3,"Within 3 mi"],[5,"Within 5 mi"]].map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${(d.maxDist||0)===v}">${l}</button>`).join("")}</div>
         <p class="note">Most postings only say the city, not the office. Distance only applies when a posting names a neighborhood.</p></div>`:`<p class="note">There's no neighborhood map for this city yet, so listings show as a list.</p>`}
     </div>`,
   ()=>`<h1>What matters most?</h1><p class="lead">Pick your top three, in order. Your matches are ranked by these after experience fit.</p>
     <div class="prio" id="prio">${Object.entries(PRI).map(([k,[l,s]])=>{ const r=(d.priorities||[]).indexOf(k); return `<button class="pcard" data-k="${k}" aria-pressed="${r>=0}"><span class="rk">${r>=0?r+1:""}</span><span><b>${l}</b><span>${s}</span></span></button>`; }).join("")}</div>
     <p class="note">${(d.priorities||[]).length}/3 chosen. Click a chosen one again to remove it.</p>`,
   ()=>`<h1>Must-haves and budget</h1><p class="lead">The job equivalent of "in-unit laundry, under $3,000." Listings that miss a must-have are hidden.</p>
     <div class="card">
       <div class="checks">${Object.entries(MUSTS).map(([k,[l,s]])=>`<label class="ck"><input type="checkbox" data-m="${k}" ${d.musts&&d.musts[k]?"checked":""}><div><b>${l}</b><span>${s}</span></div></label>`).join("")}</div>
       <div><span class="lbl">Minimum pay you'd consider</span><div class="rangeval" id="mpv">${d.minPay?"$"+d.minPay+"K":"No minimum"}</div><input type="range" id="mp" min="0" max="300" step="10" value="${d.minPay||0}" aria-label="Minimum pay in thousands"><p class="note">Sets the starting pay filter. About half of postings don't list pay, and they're hidden while a minimum is set.</p></div>
     </div>`,
   ()=>`<h1>Company size and deal-breakers</h1><p class="lead">Optional. Leave these open to see everything.</p>
     <div class="card">
       <div><span class="lbl">Company size</span><div class="chips" id="cats">${Object.entries(CATS).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${(d.cats||[]).includes(k)}" style="--c:${cvar(k)}"><span class="sw"></span>${l}</button>`).join("")}</div><p class="note">Judged by how many jobs the company has open right now. Picked sizes rank higher; others aren't hidden.</p></div>
       <div><label class="lbl" for="avoid">Deal-breakers</label><input type="text" id="avoid" value="${esc(d.avoid)}" placeholder="Words to hide, separated by commas: e.g. crypto, cold calling, night shift"></div>
       <div><label class="lbl" for="notes">Anything the resume doesn't say</label><textarea id="notes" style="min-height:80px" placeholder="e.g. very personable, loves sports, wants to leave banking. Used for interview prep.">${esc(d.notes)}</textarea></div>
     </div>`
  ];
  const last=o.step===total-1;
  $("#ob").innerHTML=`<div class="ob" role="dialog" aria-modal="true" aria-label="Job preferences"><div class="obin">
    <div class="obtop"><div class="brand"><i aria-hidden="true"></i>Minerva</div><div class="prog" aria-label="Step ${o.step+1} of ${total}">${Array.from({length:total}).map((_,i)=>`<i class="${i<=o.step?"on":""}"></i>`).join("")}</div>
      <button class="tbtn" id="obx">Close</button></div>
    ${steps[o.step]()}
    <div class="obnav"><button class="tbtn" id="obback" ${o.step===0?"disabled":""}>Back</button>
      <button class="tbtn primary" id="obnext">${last?(o.isNew?"Show my matches":"Save and re-rank"):"Next"}</button></div>
  </div></div>`;
  $("#obx").onclick=()=>{ UI.ob=null; renderOnboard(); };
  $("#obback").onclick=()=>{ o.step--; renderOnboard(); };
  const useText=()=>{ const t=(o.text||"").trim(); if(t.length<200) return; o.guess=guessExp(t); o.inferred=inferRoles(t);
    if(o.guess.exp) d.exp=o.guess.exp; if(!(d.roles||[]).length&&o.inferred.length) d.roles=o.inferred.slice(); };
  $("#obnext").onclick=()=>{
    if(o.step===0&&!(o.text||"").trim()&&!d.resumeSummary){ const f=$("#fstat"); f.textContent="Add your resume to continue, or choose Skip and just browse."; f.className="fstat err"; return; }
    if(o.step===0&&o.text&&o.text.trim().length<200){ const f=$("#fstat"); f.textContent="That's too short to be a resume. Paste the full text."; f.className="fstat err"; return; }
    if(o.step===0&&o.text&&!o.used){ useText(); o.used=true; }
    if(o.step===1&&!d.exp) d.exp="early";
    if(!last){ o.step++; renderOnboard(); return; }
    finishOnboard();
  };
  if(o.step===0){
    const drop=$("#drop"), fi=$("#file"), fs=$("#fstat");
    drop.onclick=()=>fi.click(); drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fi.click(); } };
    ["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over");}));
    ["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over");}));
    const take=async f=>{ fs.textContent="Reading "+f.name+"…"; fs.className="fstat";
      try{ o.text=await readFile(f); o.used=false; $("#rtext").value=o.text; fs.textContent=`Loaded ${f.name} · ${o.text.split(/\s+/).length} words. Check the text looks right.`; fs.className="fstat ok"; }
      catch(err){ fs.textContent=`Couldn't read ${f.name}: ${err.message}. Paste the text instead.`; fs.className="fstat err"; } };
    drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) take(f); });
    fi.onchange=()=>{ if(fi.files[0]) take(fi.files[0]); fi.value=""; };
    $("#rtext").oninput=e=>{ o.text=e.target.value; o.used=false; }; $("#nm").oninput=e=>d.name=e.target.value;
    $("#skip").onclick=()=>{ o.text=""; if(!d.exp) d.exp="early"; o.step=1; renderOnboard(); };
  }
  if(o.step===1){
    $$("#exp .chip").forEach(b=>b.onclick=()=>{ d.exp=b.dataset.k; renderOnboard(); });
    $$("#roles .chip").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; d.roles=d.roles||[]; d.roles=d.roles.includes(k)?d.roles.filter(x=>x!==k):[...d.roles,k]; b.setAttribute("aria-pressed",d.roles.includes(k)); });
  }
  if(o.step===2){
    $("#obcity").onchange=e=>{ d.city=e.target.value; renderOnboard(); };
    const hd=$("#hood"); if(hd) hd.onchange=e=>{ d.home=d.home||{}; if(e.target.value) d.home[city]={hood:e.target.value}; else delete d.home[city]; };
    $$("#dist .chip").forEach(b=>b.onclick=()=>{ d.maxDist=+b.dataset.v; renderOnboard(); });
  }
  if(o.step===3){
    $$("#prio .pcard").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; d.priorities=d.priorities||[];
      if(d.priorities.includes(k)) d.priorities=d.priorities.filter(x=>x!==k); else if(d.priorities.length<3) d.priorities.push(k); renderOnboard(); });
  }
  if(o.step===4){
    $$("[data-m]").forEach(c=>c.onchange=()=>{ d.musts=d.musts||{}; d.musts[c.dataset.m]=c.checked; });
    $("#mp").oninput=e=>{ d.minPay=+e.target.value; $("#mpv").textContent=d.minPay?"$"+d.minPay+"K":"No minimum"; };
  }
  if(o.step===5){
    $$("#cats .chip").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; d.cats=d.cats||[]; d.cats=d.cats.includes(k)?d.cats.filter(x=>x!==k):[...d.cats,k]; b.setAttribute("aria-pressed",d.cats.includes(k)); });
    $("#avoid").oninput=e=>d.avoid=e.target.value; $("#notes").oninput=e=>d.notes=e.target.value;
  }
  const first=$("#ob .obin h1"); if(first) first.setAttribute("tabindex","-1");
}
function finishOnboard(){
  const o=UI.ob, d=o.d, t=(o.text||"").trim();
  if(t.length>=200){ d.resumeSummary=redact(t).slice(0,6000)+(d.notes?"\nNotes: "+d.notes:""); const clean=redact(t).split(/\n/).slice(nameGuess(t)?1:0).join("\n"); d.kw=keywordsOf(clean); d.inferred=inferRoles(t); if(!d.name){ const n=nameGuess(t); if(n) d.name=n; } d.expYears=o.guess?o.guess.years:null; }
  if(!d.exp) d.exp="early";
  if(o.isNew){ d.demo=false; DB.profiles.push(d); }
  else { const i=DB.profiles.findIndex(x=>x.id===d.id); DB.profiles[i]=d; }
  DB.active=d.id; resetFilters(d); MS.vb=null; MEMO=null;
  UI.ob=null; renderOnboard(); persist(); renderAll();
}
function normalizeProfiles(){
  DB.profiles.forEach(p=>{ p.priorities=(p.priorities||[]).filter(k=>PRI[k]); if(!CITY[p.city]) p.city="nyc";
    if(!p.kw&&p.resumeSummary){ p.kw=keywordsOf(p.resumeSummary); p.inferred=p.inferred||inferRoles(p.resumeSummary); }
    if(!p.exp) p.exp=p.resumeSummary?(guessExp(p.resumeSummary).exp||"early"):"early"; });
}

/* ---------- mobile toggle ---------- */
$("#mobt").onclick=()=>{ const s=$("#split"); const toMap=s.classList.contains("show-list"); s.classList.toggle("show-list",!toMap); s.classList.toggle("show-map",toMap); $("#mobt").textContent=toMap?"List":"Map"; if(toMap) setTimeout(setVB,0); };

normalizeProfiles(); renderAll();
})();
</script>
